<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hotel Booking System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">🏨 Hotel Booking</a>
        <div>
          <a href="/guests" class="btn btn-outline-light btn-sm me-1">Guests</a>
          <a href="/rooms" class="btn btn-outline-light btn-sm me-1">Rooms</a>
          <a href="/book_room" class="btn btn-outline-light btn-sm me-1"
            >Book Room</a
          >
          <a href="/bookings" class="btn btn-outline-light btn-sm">Bookings</a>
        </div>
      </div>
    </nav>
    <div class="container mt-4">
      {% with messages = get_flashed_messages() %} {% if messages %} {% for msg
      in messages %}
      <div class="alert alert-success alert-dismissible fade show" role="alert">
        {{ msg }}
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
        ></button>
      </div>
      {% endfor %} {% endif %} {% endwith %} {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
