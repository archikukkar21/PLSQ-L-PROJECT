{% extends 'base.html' %}
{% block content %}
<h3>{{ action }} Room</h3>
<form method="POST" class="mt-3 shadow p-4 rounded bg-white">
  <div class="mb-3">
    <label>Room Type</label>
    <input type="text" name="type" class="form-control"
           value="{{ room['type'] if room else '' }}" required>
  </div>
  <div class="mb-3">
    <label>Price per Night</label>
    <input type="number" step="0.01" name="price" class="form-control"
           value="{{ room['price_per_night'] if room else '' }}" required>
  </div>

  {% if action == 'Edit' %}
  <div class="mb-3">
    <label>Status</label>
    <select name="status" class="form-select">
      <option value="Available" {% if room['status'] == 'Available' %}selected{% endif %}>Available</option>
      <option value="Occupied" {% if room['status'] == 'Occupied' %}selected{% endif %}>Occupied</option>
    </select>
  </div>
  {% endif %}

  <button class="btn btn-success">{{ action }} Room</button>
  <a href="/rooms" class="btn btn-secondary">Back</a>
</form>
{% endblock %}
