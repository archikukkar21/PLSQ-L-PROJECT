{% extends 'base.html' %} {% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>👤 Guest Management</h3>
  <a href="/add_guest" class="btn btn-primary">➕ Add Guest</a>
</div>

<table class="table table-hover table-bordered">
  <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Phone</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for g in guests %}
    <tr>
      <td>{{ g['guest_id'] }}</td>
      <td>{{ g['name'] }}</td>
      <td>{{ g['phone'] }}</td>
      <td>
        <a href="/edit_guest/{{ g['guest_id'] }}" class="btn btn-warning btn-sm"
          >Edit</a
        >
        <a
          href="/delete_guest/{{ g['guest_id'] }}"
          class="btn btn-danger btn-sm"
          onclick="return confirm('Delete this guest?')"
          >Delete</a
        >
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
